<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil Sorgu</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a0a0f;font-family:sans-serif;color:#f0e0e8;min-height:100vh}
.nav{background:#2a1020;border-bottom:1px solid #3d1530;padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50}
.nav-logo{font-size:14px;font-weight:800;letter-spacing:3px;color:#6b2040}
.nav-logo span{color:#ff4d7e}
.nav-tabs{display:flex;gap:4px;overflow-x:auto;flex:1}
.nav-tab{border:none;background:transparent;color:#6b3050;padding:7px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.nav-tab.active{background:#ff4d7e;color:white}
.page{display:none;padding:16px;max-width:480px;margin:0 auto}
.page.active{display:block}
.search-box{display:flex;background:#2a1020;border-radius:14px;padding:4px;border:1px solid #3d1530;gap:4px;margin-bottom:16px}
input[type=text]{flex:1;border:none;outline:none;padding:12px 14px;font-size:15px;background:transparent;color:#f0e0e8}
input::placeholder{color:#4d2038}
.search-btn{border:none;background:#ff4d7e;color:white;border-radius:10px;width:46px;height:46px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.p-card,.skin-card{background:#2a1020;border-radius:22px;padding:24px 20px;margin-bottom:16px;border:1px solid #3d1530;text-align:center}
.eq-wrap{position:relative;display:inline-block;margin-bottom:16px}
.eq-img{width:150px;height:150px;object-fit:contain;display:block}
.glow{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);width:120px;height:30px;background:#ff4d7e;filter:blur(20px);opacity:0.4;border-radius:50%}
.p-name{font-size:22px;font-weight:800;letter-spacing:2px;margin-bottom:4px}
.p-level{font-size:11px;font-weight:700;letter-spacing:3px;color:#ff4d7e;margin-bottom:18px}
.p-meta{border-top:1px solid #3d1530;padding-top:16px;text-align:left;display:flex;flex-direction:column;gap:12px}
.meta-row{display:flex;align-items:center;gap:10px}
.meta-icon{width:32px;height:32px;background:#3d1530;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.meta-icon svg{width:16px;height:16px}
.meta-label{font-size:9px;font-weight:700;letter-spacing:2px;color:#6b3050;display:block;margin-bottom:2px}
.meta-val{font-size:13px;color:#f0e0e8;word-break:break-all;display:block}
.mono{font-family:monospace;font-size:11px;color:#8b5070}
.sec{font-size:10px;font-weight:700;letter-spacing:3px;color:#6b3050;margin:16px 0 10px;display:flex;align-items:center;gap:8px}
.badge{background:#ff4d7e;color:white;padding:2px 8px;border-radius:20px;font-size:10px}
.av-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.av-box{background:#2a1020;border-radius:12px;border:1px solid #3d1530;aspect-ratio:1;display:flex;align-items:center;justify-content:center;padding:8px;cursor:pointer;transition:border-color .2s}
.av-box:active{border-color:#ff4d7e;transform:scale(0.95)}
.av-box img{width:100%;height:100%;object-fit:contain}
.skin-code-big{font-family:monospace;font-size:28px;font-weight:800;letter-spacing:8px;color:#ff4d7e;margin-bottom:14px}
.copy-btn{background:transparent;border:1px solid #ff4d7e;color:#ff4d7e;border-radius:10px;padding:9px 28px;font-size:13px;font-weight:700;cursor:pointer}
.parts-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.part-box{background:#2a1020;border-radius:14px;border:1px solid #3d1530;padding:12px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer}
.part-box:active{border-color:#ff4d7e}
.part-preview{width:64px;height:64px;object-fit:contain}
.part-id{font-family:monospace;font-size:12px;font-weight:bold;color:#f0e0e8;background:#1a0a0f;padding:3px 8px;border-radius:6px}
.part-type{font-size:9px;font-weight:700;letter-spacing:2px;color:#ff4d7e}
.part-origin{font-size:8px;color:#6b3050;letter-spacing:1px;text-align:center}
.filter-bar{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
.filter-bar::-webkit-scrollbar{display:none}
.f-btn{border:1px solid #3d1530;background:transparent;color:#6b3050;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
.f-btn.active{background:#ff4d7e;border-color:#ff4d7e;color:white}
.item-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.item-box{background:#2a1020;border-radius:10px;border:1px solid #3d1530;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;cursor:pointer}
.item-box:active{border-color:#ff4d7e;transform:scale(0.93)}
.item-box img{width:80%;height:80%;object-fit:contain}
.item-box-id{font-family:monospace;font-size:8px;color:#6b3050;margin-top:3px}
.pagination{display:flex;justify-content:center;gap:8px;margin-top:16px;align-items:center}
.page-btn{border:1px solid #3d1530;background:#2a1020;color:#f0e0e8;padding:8px 16px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer}
.page-btn:disabled{opacity:0.3}
.page-info{font-size:12px;color:#6b3050}
.bundle-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.bundle-box{border-radius:14px;border:1px solid #3d1530;overflow:hidden;cursor:pointer}
.bundle-box:active{transform:scale(0.96)}
.bundle-img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.bundle-info{background:#2a1020;padding:8px 10px}
.bundle-count{font-size:10px;color:#ff4d7e;font-weight:700;letter-spacing:1px}
.overlay{position:fixed;inset:0;background:rgba(10,2,6,0.85);display:none;align-items:flex-end;justify-content:center;z-index:100}
.overlay.open{display:flex}
.sheet{background:#2a1020;border-radius:24px 24px 0 0;border:1px solid #3d1530;border-bottom:none;padding:20px 16px 40px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto}
.sheet-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.sheet-title{font-size:11px;font-weight:700;letter-spacing:3px;color:#6b3050}
.close-btn{background:#3d1530;border:none;color:#f0e0e8;width:32px;height:32px;border-radius:8px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.sheet-item-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sheet-item{background:#1a0a0f;border-radius:12px;border:1px solid #3d1530;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.sheet-item:active{border-color:#ff4d7e}
.sheet-item img{width:70px;height:70px;object-fit:contain}
.sheet-item-id{font-family:monospace;font-size:10px;color:#ff4d7e;font-weight:700}
.sheet-item-type{font-size:9px;color:#6b3050;letter-spacing:1px}
.item-detail-img{width:130px;height:130px;object-fit:contain;margin:0 auto 12px;display:block;filter:drop-shadow(0 4px 16px rgba(255,77,126,0.3))}
.item-detail-id{font-family:monospace;font-size:22px;font-weight:800;color:#ff4d7e;text-align:center;margin-bottom:8px;letter-spacing:3px}
.origin-box{background:#1a0a0f;border-radius:12px;padding:14px;margin-top:8px;border-left:3px solid #ff4d7e}
.origin-type{font-size:9px;font-weight:700;letter-spacing:2px;color:#ff4d7e;margin-bottom:4px}
.origin-name{font-size:14px;font-weight:800;color:#f0e0e8;letter-spacing:1px}
.source-box{background:#1a0a0f;border-radius:12px;padding:12px;margin-top:8px;display:flex;align-items:center;gap:10px;cursor:pointer;border:1px solid transparent}
.source-box:active{border-color:#ff4d7e}
.source-img{width:60px;height:40px;object-fit:cover;border-radius:8px;flex-shrink:0}
.source-label{font-size:11px;color:#f0e0e8;font-weight:700}
.source-sub{font-size:9px;color:#6b3050;letter-spacing:1px;margin-top:2px}
.loading{display:flex;justify-content:center;padding:40px}
.spinner{width:28px;height:28px;border:2px solid #3d1530;border-top-color:#ff4d7e;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.err{text-align:center;color:#4d2038;padding:30px;font-size:13px}
</style>
</head>
<body><div class="nav">
  <div class="nav-logo">PROFİL<span>SORGU</span></div>
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="showPage('player',this)">Oyuncu</button>
    <button class="nav-tab" onclick="showPage('skin',this)">Skin</button>
    <button class="nav-tab" onclick="showPage('items',this)">İtemler</button>
    <button class="nav-tab" onclick="showPage('bundles',this)">Skinler</button>
  </div>
</div>

<div class="page active" id="page-player">
  <div class="search-box" style="margin-top:16px">
    <input type="text" id="in-player" placeholder="Kullanıcı adı...">
    <button class="search-btn" onclick="goPlayer()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
  </div>
  <div id="out-player"></div>
</div>

<div class="page" id="page-skin">
  <div class="search-box" style="margin-top:16px">
    <input type="text" id="in-skin" placeholder="Skin kodu... (örn: M5FND5)">
    <button class="search-btn" onclick="goSkin()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
  </div>
  <div id="out-skin"></div>
</div>

<div class="page" id="page-items">
  <div style="padding-top:16px">
    <div class="search-box">
      <input type="text" id="in-item" placeholder="Item ID ara..." oninput="searchItems()">
      <button class="search-btn" onclick="searchItems()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
    </div>
    <div class="filter-bar" id="type-filters"></div>
    <div id="out-items"><div class="loading"><div class="spinner"></div></div></div>
    <div class="pagination" id="pagination" style="display:none">
      <button class="page-btn" id="btn-prev" onclick="changePage(-1)">◀</button>
      <span class="page-info" id="page-info"></span>
      <button class="page-btn" id="btn-next" onclick="changePage(1)">▶</button>
    </div>
  </div>
</div>

<div class="page" id="page-bundles">
  <div style="padding-top:16px">
    <div id="out-bundles"><div class="loading"><div class="spinner"></div></div></div>
  </div>
</div>

<div class="overlay" id="sheet-overlay" onclick="closeSheet(event)">
  <div class="sheet">
    <div class="sheet-header">
      <span class="sheet-title" id="sheet-title">DETAY</span>
      <button class="close-btn" onclick="closeSheetDirect()">✕</button>
    </div>
    <div id="sheet-body"></div>
  </div>
</div><script>
const TYPES=['ALL','SHIRT','HAT','MASK','FRONT','BACK','EYES','MOUTH','GLASSES','HAIR','GRAVESTONE','BADGE','LEGS','BODY_PAINT'];
const RARITY={COMMON:'Yaygın',UNCOMMON:'Nadir',RARE:'Nadir+',EPIC:'Epik',LEGENDARY:'Efsanevi'};
const TYPE_TR={SHIRT:'Gömlek',HAT:'Şapka',MASK:'Maske',FRONT:'Ön',BACK:'Arka',EYES:'Göz',MOUTH:'Ağız',GLASSES:'Gözlük',HAIR:'Saç',GRAVESTONE:'Mezar',BADGE:'Rozet',LEGS:'Bacak',BODY_PAINT:'Boya',ALL:'Tümü'};
const SKIN_L={hatId:'ŞAPKA',glassesId:'GÖZLÜK',shirtId:'GÖMLEK',frontId:'ÖN',backId:'ARKA',eyesId:'GÖZ',badgeId:'ROZET',maskId:'MASKE',mouthId:'AĞIZ',gravestoneId:'MEZAR',bodyPaintId:'BOYA',hairId:'SAÇ',legsId:'BACAK'};

let curPage=1,curType='ALL',curQ='',stimer=null,iInited=false,bLoaded=false;

function showPage(n,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+n).classList.add('active');
  btn.classList.add('active');
  if(n==='items')initItems();
  if(n==='bundles')loadBundles();
}

function spin(el){el.innerHTML='<div class="loading"><div class="spinner"></div></div>';}

function renderParts(parts){
  return Object.entries(parts).map(([k,p])=>`
    <div class="part-box" onclick="openItemSource('${p.id}','${SKIN_L[k]||k}')">
      ${p.imageUrl?`<img class="part-preview" src="${p.imageUrl}" onerror="this.style.opacity=0.1">`:'<div style="width:64px;height:64px;background:#1a0a0f;border-radius:8px"></div>'}
      <div class="part-id">${p.id}</div>
      <div class="part-type">${SKIN_L[k]||k}</div>
      ${p.origin?`<div class="part-origin">${p.origin.type}: ${p.origin.name}</div>`:''}
    </div>`).join('');
}

async function goPlayer(){
  const v=document.getElementById('in-player').value.trim();
  if(!v)return;
  const el=document.getElementById('out-player');
  spin(el);
  try{
    const r=await(await fetch('/api/player/'+encodeURIComponent(v))).json();
    if(r.error){el.innerHTML='<p class="err">Bulunamadı.</p>';return;}
    el.innerHTML=`
      <div class="p-card">
        <div class="eq-wrap"><img class="eq-img" src="/cdn/${r.eq}" onerror="this.style.opacity=0.1"><div class="glow"></div></div>
        <div class="p-name">${r.n}</div>
        <div class="p-level">SEVİYE ${r.l}</div>
        <div class="p-meta">
          <div class="meta-row">
            <div class="meta-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#ff4d7e" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
            <div><span class="meta-label">ID</span><span class="meta-val mono">${r.id}</span></div>
          </div>
          <div class="meta-row">
            <div class="meta-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#ff4d7e" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
            <div><span class="meta-label">KLAN</span><span class="meta-val">${r.cn}</span></div>
          </div>
          ${r.ci!=='-'?`<div class="meta-row">
            <div class="meta-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#ff4d7e" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg></div>
            <div><span class="meta-label">KLAN ID</span><span class="meta-val mono">${r.ci}</span></div>
          </div>`:''}
        </div>
      </div>
      ${r.avs.length?`
        <div class="sec">AVATARLAR <span class="badge">${r.avs.length}</span></div>
        <div class="av-grid">${r.avs.map(a=>`
          <div class="av-box" onclick="openAvatarSlot('${r.id}',${a.slot})">
            <img src="/cdn/${a.uuid}" onerror="this.style.opacity=0.05">
          </div>`).join('')}
        </div>`:''}
    `;
  }catch(e){el.innerHTML='<p class="err">Hata.</p>';}
}

async function openAvatarSlot(playerId,slot){
  document.getElementById('sheet-title').textContent='SKİN DETAYI';
  spin(document.getElementById('sheet-body'));
  openSheet();
  try{
    const r=await(await fetch(`/api/playeravatars/${playerId}/slot/${slot}`)).json();
    if(r.error){document.getElementById('sheet-body').innerHTML='<p class="err">Bu avatar gizli veya erişilemiyor.</p>';return;}
    const partCount=Object.keys(r.parts||{}).length;
    document.getElementById('sheet-body').innerHTML=`
      <div style="text-align:center;margin-bottom:16px">
        <img src="${r.avatarUrl}" style="width:140px;height:140px;object-fit:contain;filter:drop-shadow(0 4px 16px rgba(255,77,126,0.3))">
        <div style="font-family:monospace;font-size:20px;font-weight:800;color:#ff4d7e;letter-spacing:4px;margin-top:10px">${r.code}</div>
        <button class="copy-btn" style="margin-top:8px" onclick="copyTxt('${r.code}',this)">Kopyala</button>
      </div>
      ${partCount?`
        <div class="sec">KOMBİN PARÇALARI <span class="badge">${partCount}</span></div>
        <div class="parts-grid">${renderParts(r.parts)}</div>`:''}
    `;
  }catch(e){document.getElementById('sheet-body').innerHTML='<p class="err">Hata.</p>';}
}

async function openItemSource(itemId,itemType){
  document.getElementById('sheet-title').textContent='ITEM DETAYI';
  spin(document.getElementById('sheet-body'));
  openSheet();
  try{
    const r=await(await fetch('/api/itemsource/'+encodeURIComponent(itemId))).json();
    document.getElementById('sheet-body').innerHTML=`
      <div style="text-align:center;margin-bottom:16px">
        ${r.item?.imageUrl?`<img class="item-detail-img" src="${r.item.imageUrl}" onerror="this.style.opacity=0.1">`:''}
        <div class="item-detail-id">${itemId}</div>
        <div style="font-size:10px;color:#ff4d7e;letter-spacing:2px">${itemType}</div>
        ${r.item?.rarity?`<div style="font-size:10px;color:#6b3050;margin-top:4px">${RARITY[r.item.rarity]||r.item.rarity}</div>`:''}
      </div>
      ${r.origin?`
        <div class="sec">KAYNAK</div>
        <div class="origin-box">
          <div class="origin-type">${r.origin.type}</div>
          <div class="origin-name">${r.origin.name}</div>
        </div>`:''}
      ${r.bundles.length?`
        <div class="sec" style="margin-top:16px">SKİN PAKETLERİ <span class="badge">${r.bundles.length}</span></div>
        <div style="display:flex;flex-direction:column;gap:8px">
          ${r.bundles.map(b=>`
            <div class="source-box" onclick="showBundle('${b.id}')">
              <img class="source-img" src="${b.promoImageUrl}" onerror="this.style.background='#2a1020'">
              <div>
                <div class="source-label">${b.avatarItemIds.length} itemli paket</div>
                <div class="source-sub">DETAY İÇİN TIK →</div>
              </div>
            </div>`).join('')}
        </div>`:''}
      ${!r.origin&&!r.bundles.length?'<p class="err">Kaynak bulunamadı.</p>':''}
    `;
  }catch(e){document.getElementById('sheet-body').innerHTML='<p class="err">Hata.</p>';}
}

async function goSkin(){
  const v=document.getElementById('in-skin').value.trim().toUpperCase();
  if(!v)return;
  const el=document.getElementById('out-skin');
  spin(el);
  try{
    const r=await(await fetch('/api/skin/'+encodeURIComponent(v))).json();
    if(r.error){el.innerHTML='<p class="err">Bulunamadı.</p>';return;}
    const partCount=Object.keys(r.parts||{}).length;
    el.innerHTML=`
      <div class="skin-card">
        <div class="eq-wrap"><img class="eq-img" src="${r.avatarUrl}" onerror="this.style.opacity=0.1"><div class="glow"></div></div>
        <div class="skin-code-big">${r.id}</div>
        <button class="copy-btn" onclick="copyTxt('${r.id}',this)">Kopyala</button>
      </div>
      ${partCount?`
        <div class="sec">KOMBİN PARÇALARI <span class="badge">${partCount}</span></div>
        <div class="parts-grid">${renderParts(r.parts)}</div>`:''}
    `;
  }catch(e){el.innerHTML='<p class="err">Hata.</p>';}
}

function initItems(){
  if(iInited)return;iInited=true;
  document.getElementById('type-filters').innerHTML=TYPES.map(t=>`<button class="f-btn ${t==='ALL'?'active':''}" onclick="setType('${t}',this)">${TYPE_TR[t]||t}</button>`).join('');
  loadItems();
}
function setType(t,btn){curType=t;curPage=1;document.querySelectorAll('.f-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');loadItems();}
function searchItems(){clearTimeout(stimer);stimer=setTimeout(()=>{curQ=document.getElementById('in-item').value.trim();curPage=1;loadItems();},400);}
function changePage(d){curPage+=d;loadItems();}

async function loadItems(){
  const el=document.getElementById('out-items');spin(el);
  try{
    const r=await(await fetch('/api/items?'+new URLSearchParams({type:curType,q:curQ,page:curPage}))).json();
    if(r.loading){el.innerHTML='<p class="err">Yükleniyor...</p>';setTimeout(loadItems,2000);return;}
    if(!r.items.length){el.innerHTML='<p class="err">Sonuç yok.</p>';return;}
    el.innerHTML=`
      <div class="sec">SONUÇ <span class="badge">${r.total}</span></div>
      <div class="item-grid">${r.items.map(i=>`
        <div class="item-box" onclick="openItemSource('${i.id}','${TYPE_TR[i.type]||i.type||''}')">
          <img src="${i.imageUrl}" onerror="this.style.opacity=0.1" loading="lazy">
          <div class="item-box-id">${i.id}</div>
        </div>`).join('')}
      </div>
    `;
    const pg=document.getElementById('pagination');
    pg.style.display=r.pages>1?'flex':'none';
    document.getElementById('page-info').textContent=`${r.page}/${r.pages}`;
    document.getElementById('btn-prev').disabled=r.page<=1;
    document.getElementById('btn-next').disabled=r.page>=r.pages;
  }catch(e){el.innerHTML='<p class="err">Hata.</p>';}
}

async function loadBundles(){
  if(bLoaded)return;bLoaded=true;
  const el=document.getElementById('out-bundles');spin(el);
  try{
    const r=await(await fetch('/api/bundles')).json();
    if(r.loading){el.innerHTML='<p class="err">Yükleniyor...</p>';bLoaded=false;return;}
    el.innerHTML=`
      <div class="sec">SKİNLER <span class="badge">${r.bundles.length}</span></div>
      <div class="bundle-grid">${r.bundles.map(b=>`
        <div class="bundle-box" onclick="showBundle('${b.id}')">
          <img class="bundle-img" src="${b.promoImageUrl}" onerror="this.style.background='#2a1020'">
          <div class="bundle-info"><div class="bundle-count">${b.avatarItemIds.length} İTEM</div></div>
        </div>`).join('')}
      </div>
    `;
  }catch(e){el.innerHTML='<p class="err">Hata.</p>';}
}

async function showBundle(id){
  document.getElementById('sheet-title').textContent='SKİN PAKETİ';
  spin(document.getElementById('sheet-body'));
  openSheet();
  try{
    const r=await(await fetch('/api/bundle/'+id)).json();
    document.getElementById('sheet-body').innerHTML=`
      <img src="${r.promoImageUrl}" style="width:100%;border-radius:12px;margin-bottom:14px">
      <div class="sec">İÇERİK <span class="badge">${r.items.length}</span></div>
      <div class="sheet-item-grid">${r.items.map(i=>`
        <div class="sheet-item" onclick="openItemSource('${i.id}','${TYPE_TR[i.type]||i.type||''}')">
          ${i.imageUrl?`<img src="${i.imageUrl}" onerror="this.style.opacity=0.1">`:'<div style="width:70px;height:70px;background:#1a0a0f;border-radius:8px"></div>'}
          <div class="sheet-item-id">${i.id}</div>
          <div class="sheet-item-type">${TYPE_TR[i.type]||''}</div>
        </div>`).join('')}
      </div>
    `;
  }catch(e){}
}

function openSheet(){document.getElementById('sheet-overlay').classList.add('open');}
function closeSheetDirect(){document.getElementById('sheet-overlay').classList.remove('open');}
function closeSheet(e){if(e.target===document.getElementById('sheet-overlay'))closeSheetDirect();}
function copyTxt(t,btn){navigator.clipboard.writeText(t).then(()=>{btn.textContent='Kopyalandı!';setTimeout(()=>btn.textContent='Kopyala',2000);});}

document.getElementById('in-player').addEventListener('keydown',e=>{if(e.key==='Enter')goPlayer();});
document.getElementById('in-skin').addEventListener('keydown',e=>{if(e.key==='Enter')goSkin();});
</script>
